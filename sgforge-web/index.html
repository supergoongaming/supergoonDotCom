<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Forge Editor</title>
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header>
    <h1>SG Forge Editor</h1>
    <button id="open-btn">Open .sg File</button>
    <button id="save-btn" disabled>Save Archive</button>
    <span id="file-label">No file loaded</span>
    <input type="file" id="file-input" accept=".sg">
  </header>

  <div id="tab-bar"></div>
  <div id="tab-content"></div>
  <div id="status-bar">Ready</div>

  <script src="js/sgforge.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
