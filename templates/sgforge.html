{{define "title"}}SGForge Editor - supergoon.com{{end}}

{{define "head"}}
<link rel="stylesheet" href="/static/css/editor.css">
{{end}}

{{define "content"}}
<div id="sgforge-header">
    <h2>SG Forge Editor</h2>
    <div id="sgforge-controls">
        <button id="open-btn">Open .sg File</button>
        <button id="save-btn" disabled>Save Archive</button>
        <span id="file-label">No file loaded</span>
        <input type="file" id="file-input" accept=".sg">
    </div>
</div>
<div id="tab-bar"></div>
<div id="tab-content"></div>
<div id="status-bar">Ready</div>

<script src="/static/js/sgforge.js"></script>
<script src="/static/js/forms.js"></script>
<script src="/static/js/editor.js"></script>
{{end}}
