{{define "title"}}Projects - supergoon.com{{end}}

{{define "content"}}
<h2>Projects</h2>
<div class="cards">
    {{range .Projects}}
    <div class="card">
        <h3>{{.Title}}</h3>
        <p>{{.Description}}</p>
        <div class="card-links">
            {{if .LiveURL}}<a href="{{.LiveURL}}">Play</a>{{end}}
            <a href="{{.CodeURL}}">Code</a>
        </div>
        <span class="card-year">{{.Year}}</span>
    </div>
    {{end}}
</div>
{{end}}
